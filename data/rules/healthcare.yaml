# Healthcare rules: Medicare Part B/D premiums and IRMAA, the ACA age curve, and default household cost
# assumptions (override any of them in a profile's health_costs.yaml). Dollar amounts are 2026 and grow with
# healthcare inflation (CPI plus the market preset's healthcare spread); IRMAA thresholds are CPI-indexed.
# ACA premium subsidies aren't modeled (docs/modeling.md): individual-market premiums are unsubsidized.
schema_version: 1

metadata:
  jurisdiction: US_Federal
  base_year: 2026
  description: "Medicare 2026 premiums and IRMAA, ACA federal default age curve, cost assumptions (verified 2026-09-30)."
  sources:
    - "CMS 2026 Medicare Parts A & B fact sheet: https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles"
    - "SSA POMS HI 01101.020 (IRMAA tables); 42 U.S.C. 1395r(i) (lookback, indexing, rounding, top-tier freeze)"
    - "CMS/CCIIO federal default age curve (plan years 2018+)"
    - "KFF 2026 marketplace benchmark premiums; KFF Medigap and Part D premium data (assumptions)"

medicare:
  eligibility_age: 65
  part_b_monthly_premium: 202.90
  part_b_annual_deductible: 283

# Surcharges per enrollee, by MAGI on the return two years earlier. Joint thresholds are per couple; each
# enrolled spouse pays the surcharge. The top tier ($500k/$750k, and MFS $391k) is frozen by statute until 2028.
irmaa:
  lookback_years: 2
  thresholds_indexed: true
  rounding: 1000
  tiers:
    single:
    - {up_to: 109000, part_b_adjustment: 0.00, part_d_adjustment: 0.00}
    - {up_to: 137000, part_b_adjustment: 81.20, part_d_adjustment: 14.50}
    - {up_to: 171000, part_b_adjustment: 202.90, part_d_adjustment: 37.50}
    - {up_to: 205000, part_b_adjustment: 324.60, part_d_adjustment: 60.40}
    - {up_to: 500000, part_b_adjustment: 446.30, part_d_adjustment: 83.30, indexed_from: 2028}
    - {up_to: .inf, part_b_adjustment: 487.00, part_d_adjustment: 91.00}
    joint:
    - {up_to: 218000, part_b_adjustment: 0.00, part_d_adjustment: 0.00}
    - {up_to: 274000, part_b_adjustment: 81.20, part_d_adjustment: 14.50}
    - {up_to: 342000, part_b_adjustment: 202.90, part_d_adjustment: 37.50}
    - {up_to: 410000, part_b_adjustment: 324.60, part_d_adjustment: 60.40}
    - {up_to: 750000, part_b_adjustment: 446.30, part_d_adjustment: 83.30, indexed_from: 2028}
    - {up_to: .inf, part_b_adjustment: 487.00, part_d_adjustment: 91.00}
    separate:
    - {up_to: 109000, part_b_adjustment: 0.00, part_d_adjustment: 0.00}
    - {up_to: 391000, part_b_adjustment: 446.30, part_d_adjustment: 83.30, indexed_from: 2028}
    - {up_to: .inf, part_b_adjustment: 487.00, part_d_adjustment: 91.00}

