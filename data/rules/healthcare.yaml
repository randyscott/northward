# Household cost assumptions in 2026 dollars (per person unless noted). Replace with your own in health_costs.yaml.
default_assumptions:
  employer_premium: 6850              # household employee share of family coverage (KFF 2025 average; assumption)
  individual_premium_age_40: 7500     # unsubsidized benchmark silver at 40: $625/mo (KFF 2026 US average)
  part_d_premium: 420                 # stand-alone Part D plan, ~$35/mo (CMS 2026 average)
  supplement_premium: 2160            # Medigap Plan G at 65, ~$180/mo (assumption)
  out_of_pocket_under_65: 1750        # deductibles, copays, uncovered care (CMS NHE-derived; assumption)
  out_of_pocket_65_plus: 2000         # with Medigap G: Part B deductible, dental/vision/hearing, drug copays
  dependent_coverage_until_age: 26
  hsa_medical: pay_when_retired       # HSAs reimburse qualified medical costs once the owner has retired
