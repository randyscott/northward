# Annual US returns and inflation, 1928-2025, for the historical block-bootstrap sampler (docs/decisions.md D38).
# Each year: nominal total returns of large-cap stocks, the 10-year Treasury, and 3-month T-bills, and CPI-U inflation
# (December to December). The historical_us preset in market_assumptions.yaml is computed from these values.
schema_version: 1

metadata:
  jurisdiction: US
  base_year: 2025
  description: "Damodaran annual returns (1928-2025 edition) and BLS CPI-U, retrieved 2026-10-05."
  sources:
    - "Aswath Damodaran, Historical Returns on Stocks, Bonds and Bills: 1928-2025 (histretSP.xls, sheet 'Returns by year'). https://www.stern.nyu.edu/~adamodar/pc/datasets/histretSP.xls. stocks: S&P 500 including dividends (earlier large-cap indices before 1957); bonds: 10-year constant-maturity Treasury, repriced annually from FRED yields; cash: average 3-month T-bill rate during the year."
    - "U.S. Bureau of Labor Statistics, CPI for All Urban Consumers (CPI-U), U.S. city average, all items, not seasonally adjusted (series CUUR0000SA0), via FRED series CPIAUCNS. https://fred.stlouisfed.org/series/CPIAUCNS. inflation = December index / prior December index - 1. Matches Damodaran's inflation column to within 0.06 points (2025: 2.68% from the final December 2025 index vs. 2.74%)."

