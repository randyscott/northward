# Required minimum distribution rules (tables in effect for distribution years 2022+).
schema_version: 1

metadata:
  jurisdiction: US_Federal
  base_year: 2026
  description: "RMD applicable ages, Uniform Lifetime and Single Life tables, inherited 10-year rule (verified 2026-09-29)."
  sources:
    - "26 CFR 1.401(a)(9)-9 (tables) and 1.401(a)(9)-2 (applicable age): https://www.ecfr.gov/current/title-26/section-1.401(a)(9)-9"
    - "IRS Pub. 590-B (2025), Appendix B (tables match the CFR entry for entry)"
    - "26 CFR 1.401(a)(9)-5 (10-year rule); IRS Notices 2022-53, 2023-54, 2024-35"

# Applicable (starting) age by date of birth, SECURE 2.0 §107. Entries are ordered; each covers births through
# the given year and month. RMDs begin for the year this age is reached (first one may be delayed to April 1).
start_age:
  - {born_through_year: 1949, born_through_month: 6, age: 70.5}
  - {born_through_year: 1950, age: 72}
  - {born_through_year: 1958, age: 73}
  - {born_through_year: 1959, age: 73}   # PROPOSED (REG-103529-23): the statute reads as both 73 and 75
  - {age: 75}                            # born 1960 and later

