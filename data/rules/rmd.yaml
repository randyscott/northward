# Non-eligible designated beneficiaries: empty the account by Dec 31 of the 10th year after death. If the owner
# died on or after their required beginning date, annual RMDs are also due in years 1-9, using the Single Life
# value at the beneficiary's age in the year after death, minus 1 each later year.
inherited_10_year:
  distribution_years: 10
  annual_rmds_if_decedent_started: true
  penalty_enforced_from: 2025
