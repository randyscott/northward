# Target-date glide paths (PLAN.md §4.2). Equity share is `start_equity` until `years_before` the target year,
# then declines linearly to `target_equity` at the target year, then holds flat (or follows `post_target`).
schema_version: 1

glide_paths:
  - id: linear_default
    kind: linear
    start_equity: 0.90
    years_before: 40
    target_equity: 0.50
    post_target: null          # e.g. {years_after: 7, final_equity: 0.30} to keep declining after the target
    non_equity: {bonds: 1.0, cash: 0.0}
